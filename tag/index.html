---
layout: default
---

{% assign current_tag = page.url | split: '/' | last | split: '.' | first %}

<h1>Posts tagged "{{ current_tag }}"</h1>

<ul>
{% for post in site.posts %}
  {% if post.tags contains current_tag %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endif %}
{% endfor %}
</ul>
